name: Apply ABT type class dropdown

on:
  push:
    branches:
      - feature/abt-type-class-dropdown
    paths:
      - scripts/apply-abt-type-class-dropdown.py

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/abt-type-class-dropdown
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply-abt-type-class-dropdown.py
      - name: Commit generated changes
        run: |
          rm scripts/apply-abt-type-class-dropdown.py
          rm .github/workflows/apply-abt-type-class-dropdown.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/AbtPdfFormWorkspace.tsx data/abt-license-series-options.ts scripts/apply-abt-type-class-dropdown.py .github/workflows/apply-abt-type-class-dropdown.yml
          git commit -m "Add dependent ABT type class dropdown"
          git push origin HEAD:feature/abt-type-class-dropdown
