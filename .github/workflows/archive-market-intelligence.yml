name: Archive FLLM Market Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 0"

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Export FLLM market intelligence
        run: node scripts/archive-market-intelligence.mjs

      - name: Commit archive
        run: |
          if git diff --quiet -- data/market-intelligence/archives; then
            echo "No archive changes to commit."
            exit 0
          fi
          git config user.name "FLLM Data Archive"
          git config user.email "data-archive@floridaliquorlicensemarket.com"
          git add data/market-intelligence/archives
          git commit -m "Archive FLLM market intelligence $(date -u +%F)"
          git push
