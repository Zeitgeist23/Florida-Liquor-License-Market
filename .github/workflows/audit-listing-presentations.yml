name: Audit listing presentations

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Find every listing presentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('app'), Path('components')]
          patterns = [
              r'result-card',
              r'listing-card',
              r'market-list-row',
              r'comparables\.map',
              r'listingPageHref',
              r'View License',
              r'Asking price',
          ]
          compiled = re.compile('|'.join(patterns), re.I)

          for root in roots:
              for path in sorted(root.rglob('*')):
                  if path.suffix not in {'.tsx', '.ts', '.jsx', '.js'}:
                      continue
                  text = path.read_text(encoding='utf-8', errors='ignore')
                  matches = list(compiled.finditer(text))
                  if not matches:
                      continue
                  print(f'\n===== {path} =====')
                  lines = text.splitlines()
                  shown = set()
                  for match in matches:
                      line_no = text.count('\n', 0, match.start()) + 1
                      start = max(1, line_no - 2)
                      end = min(len(lines), line_no + 3)
                      key = (start, end)
                      if key in shown:
                          continue
                      shown.add(key)
                      for number in range(start, end + 1):
                          print(f'{number:04d}: {lines[number-1]}')
                      print('---')
          PY
