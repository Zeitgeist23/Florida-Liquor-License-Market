name: One-Time FLLM Mail Diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diag-mail.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read live production mail diagnostic
        shell: bash
        run: |
          set -u
          for n in $(seq 1 12); do
            status=$(curl -sS -o /tmp/maildiag.txt -w '%{http_code}' 'https://www.floridaliquorlicensemarket.com/api/_diag-mail-91c7?k=91c7-fllm-mail' || true)
            echo "ATTEMPT=$n HTTP_STATUS=$status"
            cat /tmp/maildiag.txt 2>/dev/null || true
            echo
            if [ "$status" = "200" ] || [ "$status" = "500" ]; then
              exit 0
            fi
            sleep 10
          done
          exit 1
