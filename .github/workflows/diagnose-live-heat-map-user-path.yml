name: Diagnose actual live heat map user paths

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install browser dependency
        run: npm install --no-save --no-package-lock --ignore-scripts puppeteer-core@24.16.0

      - name: Reproduce exact user click paths
        run: |
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function firstListing(page) {
            return page.evaluate(async () => {
              const response = await fetch(`/api/market-insights-listings?diag=${Date.now()}`, { cache: 'no-store' });
              const payload = await response.json();
              return (Array.isArray(payload.listings) ? payload.listings : [])
                .find((listing) => listing?.sourceRef && listing?.county) || null;
            });
          }

          async function clickVisibleButtonByText(page, selector, text) {
            const handles = await page.$$(selector);
            for (const handle of handles) {
              const label = await handle.evaluate((element) => (element.textContent || '').replace(/\s+/g, ' ').trim());
              const visible = await handle.evaluate((element) => {
                const style = getComputedStyle(element);
                const rect = element.getBoundingClientRect();
                return style.visibility !== 'hidden' && style.display !== 'none' && rect.width > 0 && rect.height > 0;
              });
              if (visible && label.toLowerCase() === text.toLowerCase()) {
                await handle.click();
                return true;
              }
            }
            return false;
          }

          async function clickCounty(page, countyName) {
            const county = String(countyName).replace(/\s+County$/i, '');
            await page.waitForSelector('.fllm-heat-map-modal path[data-heat-map-county]', { timeout: 30000 });
            const clicked = await page.evaluate((name) => {
              const path = Array.from(document.querySelectorAll('.fllm-heat-map-modal path[data-heat-map-county]'))
                .find((candidate) => (candidate.getAttribute('data-heat-map-county') || '').toLowerCase() === name.toLowerCase());
              if (!path) return false;
              path.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));
              return true;
            }, county);
            if (!clicked) throw new Error(`County path not found: ${county}`);
            await page.waitForSelector('.fllm-county-listings-dialog', { timeout: 30000 });
            await sleep(1000);
          }

          async function inspectDialog(page, label) {
            const state = await page.evaluate(() => {
              const dialog = document.querySelector('.fllm-county-listings-dialog');
              const currentCards = Array.from(dialog?.querySelectorAll('.fllm-popup-card-shell.results-page .result-card') || []);
              const oldCards = Array.from(dialog?.querySelectorAll('.fllm-county-listing-card') || []);
              return {
                currentCount: currentCards.length,
                oldCount: oldCards.length,
                cards: currentCards.map((card) => {
                  const button = card.querySelector('.result-view-button');
                  return {
                    reference: card.getAttribute('data-listing-reference') || '',
                    dataHref: card.getAttribute('data-listing-href') || '',
                    buttonHref: button instanceof HTMLAnchorElement ? new URL(button.href, location.origin).pathname : '',
                    buttonText: button?.textContent?.replace(/\s+/g, ' ').trim() || '',
                    background: getComputedStyle(card).backgroundImage,
                  };
                }),
                oldCards: oldCards.map((card) => ({
                  reference: card.querySelector('.fllm-county-listing-reference')?.textContent?.replace(/\s+/g, ' ').trim() || '',
                  firstHref: card.querySelector('a') instanceof HTMLAnchorElement ? new URL(card.querySelector('a').href, location.origin).pathname : '',
                  background: getComputedStyle(card).backgroundImage,
                })),
                scripts: Array.from(document.scripts).map((script) => script.src).filter((src) => /market-heat-map|card-sync/.test(src)),
              };
            });
            console.log(`${label}: ${JSON.stringify(state, null, 2)}`);
            return state;
          }

          async function testListings(browser) {
            const page = await browser.newPage();
            await page.setViewport({ width: 1700, height: 1000 });
            page.on('console', (message) => console.log(`LISTINGS CONSOLE ${message.type()}: ${message.text()}`));
            page.on('pageerror', (error) => console.log(`LISTINGS PAGEERROR: ${error.stack || error.message}`));
            await page.goto(`https://www.floridaliquorlicensemarket.com/listings?diag=${Date.now()}`, { waitUntil: 'networkidle2', timeout: 90000 });
            const record = await firstListing(page);
            console.log('LISTINGS RECORD:', JSON.stringify(record));
            if (!await clickVisibleButtonByText(page, '.results-filters button', 'Heat Map')) throw new Error('Visible listings Heat Map button not found.');
            await page.waitForSelector('.fllm-heat-map-modal', { timeout: 30000 });
            await clickCounty(page, record.county);
            await page.screenshot({ path: 'listings-county-dialog.png' });
            const state = await inspectDialog(page, 'LISTINGS DIALOG');
            const first = state.cards[0];
            if (!first) throw new Error('No current-format listing card exists in listings heat map dialog.');
            const selector = `.fllm-county-listings-dialog .result-card[data-listing-reference="${first.reference}"] .result-view-button`;
            const hrefBefore = first.buttonHref;
            await page.click(selector);
            await page.waitForFunction((oldPath) => location.pathname !== oldPath, { timeout: 15000 }, '/listings').catch(() => null);
            await sleep(500);
            console.log('LISTINGS CLICK RESULT:', JSON.stringify({ hrefBefore, actual: new URL(page.url()).pathname, url: page.url() }));
            return { state, hrefBefore, actual: new URL(page.url()).pathname };
          }

          async function testHome(browser) {
            const page = await browser.newPage();
            await page.setViewport({ width: 1700, height: 1000 });
            page.on('console', (message) => console.log(`HOME CONSOLE ${message.type()}: ${message.text()}`));
            page.on('pageerror', (error) => console.log(`HOME PAGEERROR: ${error.stack || error.message}`));
            await page.goto(`https://www.floridaliquorlicensemarket.com/?diag=${Date.now()}`, { waitUntil: 'networkidle2', timeout: 90000 });
            const record = await firstListing(page);
            console.log('HOME RECORD:', JSON.stringify(record));

            const opened = await page.evaluate(() => {
              const trigger = Array.from(document.querySelectorAll('.primary-nav a'))
                .find((link) => (link.textContent || '').replace(/\s+/g, ' ').trim().toLowerCase() === 'market data');
              if (!(trigger instanceof HTMLElement)) return false;
              trigger.click();
              return true;
            });
            if (!opened) throw new Error('Homepage Market Data trigger not found.');
            await sleep(400);

            if (!await clickVisibleButtonByText(page, '.market-data-header-menu button, #market-data-header-menu button', 'Heat Map')) {
              throw new Error('Visible homepage Heat Map menu option not found.');
            }
            await page.waitForSelector('.fllm-heat-map-modal', { timeout: 30000 });
            await clickCounty(page, record.county);
            await page.screenshot({ path: 'homepage-county-dialog.png' });
            const state = await inspectDialog(page, 'HOME DIALOG');
            return state;
          }

          (async () => {
            const browser = await puppeteer.launch({ executablePath: process.env.CHROME_PATH || '/usr/bin/google-chrome', headless: true, args: ['--no-sandbox', '--disable-dev-shm-usage'] });
            try {
              const listingsResult = await testListings(browser);
              const homeResult = await testHome(browser);
              console.log('FINAL DIAGNOSTIC:', JSON.stringify({ listingsResult, homeResult }, null, 2));
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error.stack || error);
            process.exit(1);
          });
          NODE

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-heat-map-diagnostics-v2
          path: |
            listings-county-dialog.png
            homepage-county-dialog.png
          if-no-files-found: ignore
