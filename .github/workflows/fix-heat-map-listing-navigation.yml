name: Apply heat map listing navigation repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[heat-map-navigation-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair heat map listing cards and links
        run: python scripts/fix_heat_map_navigation.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build every route
        run: npm run build

      - name: Commit verified repair
        run: |
          git config user.name "Zeitgeist23"
          git config user.email "JWigg023@gmail.com"
          git add app/api/market-insights-listings/route.ts app/api/homepage/route.ts components/ListingsHeatMapEnhancement.tsx public/assets/market-heat-map-popup-cards-v3.js public/assets/market-heat-map-listings-card-sync-v1.js
          git commit -m "Fix heat map listing links and card consistency [heat-map-navigation-fixed]"
          git push origin main
