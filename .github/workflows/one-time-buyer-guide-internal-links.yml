name: One-time buyer guide internal resource links

on:
  push:
    branches:
      - fix/buyer-guide-internal-resources

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/buyer-guide-internal-resources
          fetch-depth: 0

      - name: Keep buyer guide resource cards inside FLLM
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/how-to-buy-florida-liquor-license/page.tsx')
          text = path.read_text()
          replacements = {
            'href="https://www2.myfloridalicense.com/alcoholic-beverages-and-tobacco/" target="_blank" rel="noopener noreferrer"': 'href="/resources/official/florida-abt"',
            'href="https://www.myfloridalicense.com/CheckListDetail.asp?SID=&XACT_DEFN_ID=13356&clientCode=4008&xactCode=1060" target="_blank" rel="noopener noreferrer"': 'href="/resources/official/transfer-of-ownership"',
            'href="https://www2.myfloridalicense.com/alcoholic-beverages-and-tobacco/quota-license-information/" target="_blank" rel="noopener noreferrer"': 'href="/resources/official/quota-license-information"',
            'href="https://www.leg.state.fl.us/Statutes/index.cfm?App_mode=Display_Statute&URL=0500-0599/0561/Sections/0561.20.html" target="_blank" rel="noopener noreferrer"': 'href="/resources/official/statute-561-20"',
            'href="https://www.leg.state.fl.us/Statutes/index.cfm?App_mode=Display_Statute&URL=0500-0599/0561/Sections/0561.32.html" target="_blank" rel="noopener noreferrer"': 'href="/resources/official/statute-561-32"',
            'href="https://www.leg.state.fl.us/Statutes/index.cfm?App_mode=Display_Statute&URL=0500-0599/0561/Sections/0561.15.html" target="_blank" rel="noopener noreferrer"': 'href="/resources/official/statute-561-15"',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'Missing expected buyer-guide link: {old[:80]}')
            text = text.replace(old, new, 1)
          path.write_text(text)

          workflow = Path('.github/workflows/one-time-buyer-guide-internal-links.yml')
          if workflow.exists():
            workflow.unlink()
          PY

      - name: Commit internal resource links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep buyer guide resource cards inside FLLM"
          git push origin HEAD:fix/buyer-guide-internal-resources
