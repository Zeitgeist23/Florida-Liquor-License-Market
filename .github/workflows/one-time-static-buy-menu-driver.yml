name: One-time direct static BUY menu patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run direct static BUY menu patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-homepage-buy-menu-root
          fetch-depth: 0

      - name: Patch actual static homepage, hydration bundle, and CSS
        run: |
          python - <<'PY'
          from pathlib import Path

          html_path = Path('public/index.html')
          js_path = Path('public/assets/page-B81INvpQ.js')
          css_path = Path('public/assets/index-DsiZO1T9.css')

          html = html_path.read_text()
          old_html = '<a href="/listings"><span>Buy</span><img class="nav-chevron" src="/assets/nav-chevron.png" alt="" aria-hidden="true"/></a>'
          new_html = '<div class="buy-nav-dropdown"><button class="buy-nav-trigger" type="button" aria-haspopup="true"><span>Buy</span><img class="nav-chevron" src="/assets/nav-chevron.png" alt="" aria-hidden="true"/></button><div class="buy-nav-menu"><a href="/listings">View Listings</a><a href="/how-to-buy-florida-liquor-license">How to Buy a Florida Liquor License</a></div></div>'
          if old_html not in html:
              raise SystemExit('Static homepage BUY anchor not found')
          html_path.write_text(html.replace(old_html, new_html, 1))

          js = js_path.read_text()
          old_js = '(0,a.jsxs)(`a`,{href:`/listings`,children:[(0,a.jsx)(`span`,{children:`Buy`}),(0,a.jsx)(`img`,{className:`nav-chevron`,src:`/assets/nav-chevron.png`,alt:``,"aria-hidden":`true`})]})'
          new_js = '(0,a.jsxs)(`div`,{className:`buy-nav-dropdown`,children:[(0,a.jsxs)(`button`,{className:`buy-nav-trigger`,type:`button`,"aria-haspopup":`true`,children:[(0,a.jsx)(`span`,{children:`Buy`}),(0,a.jsx)(`img`,{className:`nav-chevron`,src:`/assets/nav-chevron.png`,alt:``,"aria-hidden":`true`})]}),(0,a.jsxs)(`div`,{className:`buy-nav-menu`,children:[(0,a.jsx)(`a`,{href:`/listings`,children:`View Listings`}),(0,a.jsx)(`a`,{href:`/how-to-buy-florida-liquor-license`,children:`How to Buy a Florida Liquor License`})]})]})'
          if old_js not in js:
              raise SystemExit('Hydration bundle BUY anchor not found')
          js_path.write_text(js.replace(old_js, new_js, 1))

          css = css_path.read_text()
          marker = '/* FLLM BUY DROPDOWN - DIRECT STATIC IMPLEMENTATION */'
          if marker not in css:
              css += r'''
/* FLLM BUY DROPDOWN - DIRECT STATIC IMPLEMENTATION */
.buy-nav-dropdown{position:relative;display:inline-flex;align-items:center;flex:0 0 auto}
.buy-nav-trigger{display:inline-flex;align-items:center;gap:5px;margin:0;padding:0;border:0;background:transparent;color:#fff;font:inherit;font-size:10px;font-weight:600;text-transform:uppercase;white-space:nowrap;cursor:pointer}
.buy-nav-trigger:hover,.buy-nav-trigger:focus-visible{color:#f6a700;outline:none}
.buy-nav-menu{position:absolute;top:100%;left:50%;z-index:10050;display:none;width:310px;transform:translateX(-50%);padding:6px;border:1px solid #f6a700;border-radius:6px;background:#061728;box-shadow:0 18px 48px rgba(0,0,0,.48)}
.buy-nav-dropdown:hover .buy-nav-menu,.buy-nav-dropdown:focus-within .buy-nav-menu{display:grid;gap:4px}
.primary-nav .buy-nav-menu a{display:block;width:100%;padding:12px 13px;border-radius:4px;color:#fff;text-decoration:none;text-transform:none;white-space:normal;font:700 13px/1.3 Arial,Helvetica,sans-serif;letter-spacing:.01em}
.primary-nav .buy-nav-menu a:hover,.primary-nav .buy-nav-menu a:focus-visible{background:#f6a700;color:#061728;outline:none}
@media(max-width:820px){.buy-nav-dropdown{width:100%;justify-content:center}.buy-nav-trigger{width:100%;justify-content:center;padding:12px}.buy-nav-menu{top:100%;width:min(310px,calc(100vw - 24px))}}
'''
              css_path.write_text(css)

          next_path = Path('next.config.ts')
          next_text = next_path.read_text().replace(
              '{ source: "/", destination: "/api/homepage-with-buy-menu" },',
              '{ source: "/", destination: "/api/homepage" },'
          )
          next_path.write_text(next_text)

          wrapper = Path('app/api/homepage-with-buy-menu/route.ts')
          if wrapper.exists():
              wrapper.unlink()

          page_path = Path('app/page.tsx')
          page = page_path.read_text()
          page = page.replace('import HomeBuyDropdown from "@/components/HomeBuyDropdown";\n', '')
          page = page.replace('      <HomeBuyDropdown />\n', '')
          page_path.write_text(page)

          old_component = Path('components/HomeBuyDropdown.tsx')
          if old_component.exists():
              old_component.unlink()

          branch_workflow = Path('.github/workflows/one-time-static-buy-menu.yml')
          if branch_workflow.exists():
              branch_workflow.unlink()
          PY

      - name: Commit direct static implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add BUY hover menu to actual live static homepage"
          git push origin HEAD:fix/live-homepage-buy-menu-root
