name: One-Time Vraj Buyer Email Test

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-vraj-buyer-email-test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Submit real FLLM buyer inquiry for Vraj listing
        shell: bash
        run: |
          cat > /tmp/vraj-live-email-test.cjs <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const buyerEmail = 'jwigg023@gmail.com';
            const listingRef = 'FLLM-168405';
            const listingText = 'FLLM-168405 — Sarasota County — 3PS Quota / Package Store — $550,000';
            const contactUrl = 'https://www.floridaliquorlicensemarket.com/contact?source=specific-license&ref=FLLM-168405&county=Sarasota%20County&license_type=3PS%20Quota%20%2F%20Package%20Store&asking_price=%24550%2C000&listing_status=Active%20%2F%20Available&listing_url=%2Flistings%2FFLLM-168405&listing=' + encodeURIComponent(listingText);

            const fd = new FormData();
            fd.set('name', 'James Wigg');
            fd.set('email', buyerEmail);
            fd.set('inquiry_type', 'Buy a License');
            fd.set('preferred_county', 'Sarasota County');
            fd.set('message', 'TEST BUYER INQUIRY — FLLM end-to-end delivery verification for Vraj Patel’s Sarasota County listing FLLM-168405. No response or action is required.');
            fd.set('listing_reference', listingRef);
            fd.set('listing_requested', listingText);
            fd.set('listing_county', 'Sarasota County');
            fd.set('license_type', '3PS Quota / Package Store');
            fd.set('asking_price', '$550,000');
            fd.set('listing_status', 'Active / Available');
            fd.set('listing_url', '/listings/FLLM-168405');
            fd.set('_subject', 'Florida Liquor License Market — TEST Buyer Inquiry — FLLM-168405');

            const apiRes = await fetch('https://www.floridaliquorlicensemarket.com/api/inquiry', {
              method: 'POST',
              body: fd,
            });
            const apiText = await apiRes.text();
            let apiBody = {};
            try { apiBody = JSON.parse(apiText); } catch {}
            console.log('API_STATUS=' + apiRes.status);
            console.log('API_BODY=' + apiText.slice(0, 2000));

            if (apiRes.ok) {
              console.log('PRIMARY_DELIVERY_REPORTED_SUCCESS=true');
              return;
            }

            if (![429, 502].includes(apiRes.status)) {
              throw new Error('Unexpected inquiry API status: ' + apiRes.status);
            }

            const fallbackFields = [];
            for (const [k, v] of fd.entries()) {
              if (typeof v === 'string') fallbackFields.push([k, v]);
            }
            if (Array.isArray(apiBody.fallbackCc) && apiBody.fallbackCc.length) {
              fallbackFields.push(['_cc', apiBody.fallbackCc.join(',')]);
            }
            if (apiBody.fallbackSellerContact) {
              const c = apiBody.fallbackSellerContact;
              if (c.name) fallbackFields.push(['listing_representative', c.name]);
              if (c.email) fallbackFields.push(['listing_representative_email', c.email]);
              if (c.phone) fallbackFields.push(['listing_representative_phone', c.phone]);
            }
            fallbackFields.push(['_subject', 'Florida Liquor License Market — TEST Buyer Inquiry — FLLM-168405']);
            fallbackFields.push(['_template', 'table']);
            fallbackFields.push(['_url', contactUrl]);

            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            page.on('console', msg => console.log('BROWSER_CONSOLE=' + msg.type() + ':' + msg.text()));
            page.on('response', async response => {
              if (response.url().includes('formsubmit.co')) {
                console.log('FORMSUBMIT_RESPONSE=' + response.status() + ' ' + response.url());
              }
            });

            await page.goto(contactUrl, { waitUntil: 'domcontentloaded', timeout: 90000 });
            await page.evaluate(({ fields }) => {
              const form = document.createElement('form');
              form.method = 'POST';
              form.action = 'https://formsubmit.co/listings@floridaliquorlicensemarket.com';
              for (const [name, value] of fields) {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = name;
                input.value = value;
                form.appendChild(input);
              }
              document.body.appendChild(form);
              form.submit();
            }, { fields: fallbackFields });

            await page.waitForTimeout(15000);
            console.log('FINAL_URL=' + page.url());
            console.log('FINAL_TITLE=' + await page.title());
            const bodyText = await page.locator('body').innerText().catch(() => '');
            console.log('FINAL_BODY=' + bodyText.slice(0, 2500).replace(/\n/g, ' | '));
            await browser.close();
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          NODE
          NODE_PATH="$PWD/node_modules" node /tmp/vraj-live-email-test.cjs
