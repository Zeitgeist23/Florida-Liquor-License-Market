name: Patch Native Form Inquiry Fallback

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-browser-inquiry-fallback.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Patch native form inquiry fallback'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace CORS-blocked AJAX fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('public/assets/page-BbHDipGH.js')
          source = js.read_text()
          old = '''try{let e=await fetch(`/api/inquiry`,{method:`POST`,body:r});if(e.status===429||e.status===502){let t={};try{t=await e.clone().json()}catch{}Array.isArray(t.fallbackCc)&&t.fallbackCc.length&&r.set(`_cc`,t.fallbackCc.join(`,`));let i=t.fallbackSellerContact;i&&typeof i===`object`&&(i.name&&r.set(`listing_representative`,i.name),i.email&&r.set(`listing_representative_email`,i.email),i.phone&&r.set(`listing_representative_phone`,i.phone));r.set(`_subject`,`Florida Liquor License Market — New Contact Inquiry`),r.set(`_template`,`table`),r.set(`_captcha`,`false`),e=await fetch(`https://formsubmit.co/ajax/listings@floridaliquorlicensemarket.com`,{method:`POST`,headers:{Accept:`application/json`},body:r})}if(!e.ok)throw Error(`Unable to submit inquiry`);t(`sent`),n.reset()}catch{t(`error`)}}'''
          new = '''try{let e=await fetch(`/api/inquiry`,{method:`POST`,body:r});if(e.status===429||e.status===502){let a={};try{a=await e.clone().json()}catch{}Array.isArray(a.fallbackCc)&&a.fallbackCc.length&&r.set(`_cc`,a.fallbackCc.join(`,`));let i=a.fallbackSellerContact;i&&typeof i===`object`&&(i.name&&r.set(`listing_representative`,i.name),i.email&&r.set(`listing_representative_email`,i.email),i.phone&&r.set(`listing_representative_phone`,i.phone));r.set(`_subject`,`Florida Liquor License Market — New Contact Inquiry`),r.set(`_template`,`table`),r.set(`_captcha`,`false`),r.set(`_url`,window.location.href);let o=document.createElement(`iframe`);o.name=`fllm-formsubmit-${Date.now()}`,o.style.display=`none`,document.body.appendChild(o);let s=document.createElement(`form`);s.method=`POST`,s.action=`https://formsubmit.co/listings@floridaliquorlicensemarket.com`,s.target=o.name,s.style.display=`none`;for(let[e,t]of r.entries())if(typeof t===`string`){let n=document.createElement(`input`);n.type=`hidden`,n.name=e,n.value=t,s.appendChild(n)}document.body.appendChild(s),s.submit(),window.setTimeout(()=>{s.remove(),o.remove()},15e3),t(`sent`),n.reset();return}if(!e.ok)throw Error(`Unable to submit inquiry`);t(`sent`),n.reset()}catch{t(`error`)}}'''
          if old not in source:
              raise SystemExit('CORS fallback marker not found')
          source = source.replace(old, new, 1)
          js.write_text(source)
          PY
          node --check public/assets/page-BbHDipGH.js
          git diff --check
      - name: Commit native form fallback
        shell: bash
        run: |
          git config user.name 'Zeitgeist23'
          git config user.email 'JWigg023@gmail.com'
          git add public/assets/page-BbHDipGH.js
          git commit -m 'Use native form fallback for seller inquiries'
          git push origin main
