name: Patch FormSubmit JSON Fallback

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-formsubmit-json-fallback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Use documented FormSubmit JSON AJAX request
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/assets/page-BbHDipGH.js')
          s = p.read_text()
          old = '''r.set(`_subject`,`Florida Liquor License Market — New Contact Inquiry`),r.set(`_template`,`table`),r.set(`_captcha`,`false`),r.set(`_url`,window.location.href);let o=document.createElement(`iframe`);o.name=`fllm-formsubmit-${Date.now()}`,o.style.display=`none`,document.body.appendChild(o);let s=document.createElement(`form`);s.method=`POST`,s.action=`https://formsubmit.co/listings@floridaliquorlicensemarket.com`,s.target=o.name,s.style.display=`none`;for(let[e,t]of r.entries())if(typeof t===`string`){let n=document.createElement(`input`);n.type=`hidden`,n.name=e,n.value=t,s.appendChild(n)}document.body.appendChild(s),s.submit(),window.setTimeout(()=>{s.remove(),o.remove()},15e3),t(`sent`),n.reset();return'''
          new = '''r.set(`_subject`,`Florida Liquor License Market — New Contact Inquiry`),r.set(`_template`,`table`),r.set(`_url`,window.location.href);let o={};for(let[e,t]of r.entries())typeof t===`string`&&(o[e]=t);let s=await fetch(`https://formsubmit.co/ajax/listings@floridaliquorlicensemarket.com`,{method:`POST`,headers:{"Content-Type":`application/json`,Accept:`application/json`},body:JSON.stringify(o)});if(!s.ok)throw Error(`Unable to submit inquiry fallback`);t(`sent`),n.reset();return'''
          if old not in s:
              raise SystemExit('native fallback marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check public/assets/page-BbHDipGH.js
          git diff --check
      - name: Commit JSON fallback
        shell: bash
        run: |
          git config user.name 'Zeitgeist23'
          git config user.email 'JWigg023@gmail.com'
          git add public/assets/page-BbHDipGH.js
          git commit -m 'Use documented FormSubmit JSON inquiry fallback'
          git push origin main
