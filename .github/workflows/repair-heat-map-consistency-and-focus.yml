name: Repair heat map consistency and listing focus

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[heat-map-direct-cards-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply direct-card repair
        run: python scripts/repair_heat_map_consistency.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate scripts and build
        run: |
          node --check public/assets/market-heat-map.js
          node --check public/assets/market-heat-map-popup-cards-v3.js
          npm run build

      - name: Commit verified repair
        run: |
          git config user.name "Zeitgeist23"
          git config user.email "JWigg023@gmail.com"
          git add public/assets/market-heat-map.js \
            public/assets/market-heat-map-popup-cards-v3.js \
            components/ListingsHeatMapEnhancement.tsx \
            app/api/homepage/route.ts \
            components/ListingsPage.tsx \
            app/listings/listings-conversion-cards.css
          git commit -m "Render heat-map cards directly and focus selected listing [heat-map-direct-cards-fixed]"
          git push origin main
