name: Sync Florida Quota Drawing

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/sync-quota-drawing.mjs
      - .github/workflows/sync-quota-drawing.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PDF text utility
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Pull and validate current DBPR quota notice
        run: node scripts/sync-quota-drawing.mjs

      - name: Publish DBPR data changes
        run: |
          if git diff --quiet -- data/quota-drawing-current.json; then
            echo "No DBPR quota drawing changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quota-drawing-current.json
          git commit -m "Sync current Florida quota drawing data from DBPR"
          git push
