name: Unify core public listing cards

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[listing-card-core]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the canonical listings-page cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def load(path):
              return Path(path).read_text(encoding='utf-8')

          def save(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def add_after(path, anchor, addition, label):
              text = load(path)
              if addition.strip() in text:
                  return
              if anchor not in text:
                  raise SystemExit(f'{label}: anchor not found in {path}')
              save(path, text.replace(anchor, anchor + addition, 1))

          def sub(path, pattern, replacement, label):
              text = load(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match in {path}, found {count}')
              save(path, updated)

          # Main listings route imports one centralized stylesheet stack.
          sub(
              'app/listings/page.tsx',
              r'import "\./listings-premium\.css";.*?import "\./listings-seo-footer\.css";',
              'import "./listing-card-system.css";',
              'listings stylesheet system',
          )

          # County pages.
          add_after(
              'app/counties/[slug]/page.tsx',
              'import FloridaCountyMap from "@/components/FloridaCountyMap";\n',
              'import MarketplaceListingCard from "@/components/MarketplaceListingCard";\n',
              'county card import',
          )
          sub(
              'app/counties/[slug]/page.tsx',
              r'import "\./county-page\.css";\n(?:import "\.\./\.\./listings/[^"\n]+\.css";\n)+',
              'import "./county-page.css";\nimport "../../listings/listing-card-system.css";\n',
              'county stylesheet system',
          )
          sub(
              'app/counties/[slug]/page.tsx',
              r'\{available\.map\(\(listing\) => \(\s*<article className="result-card result-card-available".*?</article>\s*\)\)\}',
              '''{available.map((listing) => (
                    <MarketplaceListingCard
                      id={listing.sourceRef}
                      key={listingKey(listing)}
                      listing={listing}
                    />
                  ))}''',
              'county listing cards',
          )

          # 4COP marketplace page.
          add_after(
              'app/florida-4cop-liquor-license-for-sale/page.tsx',
              'import FloridaCountyMap from "@/components/FloridaCountyMap";\n',
              'import MarketplaceListingCard from "@/components/MarketplaceListingCard";\n',
              '4cop card import',
          )
          sub(
              'app/florida-4cop-liquor-license-for-sale/page.tsx',
              r'import "\.\./listings/listings-premium\.css";.*?import "\.\./florida-liquor-licenses-for-sale/seo-market\.css";',
              'import "../listings/listing-card-system.css";\nimport "../florida-liquor-licenses-for-sale/seo-market.css";',
              '4cop stylesheet system',
          )
          sub(
              'app/florida-4cop-liquor-license-for-sale/page.tsx',
              r'\{previewListings\.map\(\(listing\) => \(\s*<article className="result-card result-card-available".*?</article>\s*\)\)\}',
              '''{previewListings.map((listing) => (
                  <MarketplaceListingCard
                    key={listing.sourceRef ?? `${listing.county}-${listing.type}-${listing.priceLabel}`}
                    listing={listing}
                  />
                ))}''',
              '4cop listing cards',
          )
          text = load('app/florida-4cop-liquor-license-for-sale/page.tsx')
          text = text.replace('className="results-page seo-market-preview-results"', 'className="results-page embedded-listing-results seo-market-preview-results"', 1)
          save('app/florida-4cop-liquor-license-for-sale/page.tsx', text)

          # 3PS marketplace page.
          add_after(
              'app/florida-3ps-liquor-license-for-sale/page.tsx',
              'import FloridaCountyMap from "@/components/FloridaCountyMap";\n',
              'import MarketplaceListingCard from "@/components/MarketplaceListingCard";\n',
              '3ps card import',
          )
          sub(
              'app/florida-3ps-liquor-license-for-sale/page.tsx',
              r'import "\.\./listings/listings-premium\.css";.*?import "\.\./florida-liquor-licenses-for-sale/seo-market\.css";',
              'import "../listings/listing-card-system.css";\nimport "../florida-liquor-licenses-for-sale/seo-market.css";',
              '3ps stylesheet system',
          )
          sub(
              'app/florida-3ps-liquor-license-for-sale/page.tsx',
              r'\{previewListings\.map\(\(listing\) => \(\s*<article className="result-card".*?</article>\s*\)\)\}',
              '''{previewListings.map((listing) => (
                    <MarketplaceListingCard
                      key={listing.sourceRef ?? `${listing.county}-${listing.type}-${listing.priceLabel}`}
                      listing={listing}
                    />
                  ))}''',
              '3ps listing cards',
          )
          text = load('app/florida-3ps-liquor-license-for-sale/page.tsx')
          text = text.replace('className="results-page seo-market-preview-results"', 'className="results-page embedded-listing-results seo-market-preview-results"', 1)
          text = text.replace('import InventoryCardExpansion from "@/components/InventoryCardExpansion";\n', '')
          text = text.replace('      <InventoryCardExpansion />\n', '')
          save('app/florida-3ps-liquor-license-for-sale/page.tsx', text)

          # Main valuation estimator.
          text = load('components/LiquorLicenseValueEstimator.tsx')
          text = text.replace('import Link from "next/link";\n', '')
          text = text.replace('import { useRouter } from "next/navigation";\n', '')
          text = text.replace('import { listingPageHref } from "@/lib/listing-page-urls";\n', '')
          text = text.replace('import interactionStyles from "./ComparableListingRows.module.css";\n', '')
          if 'import MarketplaceListingCard from "./MarketplaceListingCard";' not in text:
              text = text.replace(
                  'import styles from "./LiquorLicenseValueEstimator.module.css";\n',
                  'import MarketplaceListingCard from "./MarketplaceListingCard";\nimport styles from "./LiquorLicenseValueEstimator.module.css";\n',
                  1,
              )
          text = text.replace('  const router = useRouter();\n', '')
          save('components/LiquorLicenseValueEstimator.tsx', text)
          sub(
              'components/LiquorLicenseValueEstimator.tsx',
              r'\{guidance\.comparables\.length > 0 \? \(\s*<div className=\{styles\.tableWrap\}>.*?</div>\s*\) : \(',
              '''{guidance.comparables.length > 0 ? (
              <div className="results-page embedded-listing-results listing-cards-two">
                <div className="results-grid">
                  {guidance.comparables.map((listing, index) => (
                    <MarketplaceListingCard
                      key={`${listing.reference}-${listing.askingPrice}-${index}`}
                      listing={{
                        county: listing.county,
                        type: listing.licenseType,
                        price: listing.askingPrice,
                        priceLabel: currency(listing.askingPrice),
                        sourceRef: listing.reference,
                        licenseStatus: listing.status,
                        image: "/assets/license-market/license-01.png",
                      }}
                    />
                  ))}
                </div>
              </div>
            ) : (''',
              'valuation comparable cards',
          )
          add_after(
              'app/florida-liquor-license-value/page.tsx',
              'import "./value-page.css";\n',
              'import "@/app/listings/listing-card-system.css";\n',
              'valuation stylesheet system',
          )

          # Dedicated county value pages.
          add_after(
              'app/counties/[slug]/liquor-license-value/page.tsx',
              'import FormsSiteHeader from "@/components/FormsSiteHeader";\n',
              'import MarketplaceListingCard from "@/components/MarketplaceListingCard";\n',
              'county value card import',
          )
          add_after(
              'app/counties/[slug]/liquor-license-value/page.tsx',
              'import "./county-value-page.css";\n',
              'import "@/app/listings/listing-card-system.css";\n',
              'county value stylesheet system',
          )
          sub(
              'app/counties/[slug]/liquor-license-value/page.tsx',
              r'\{comparables\.length \? \(\s*<div className="county-value-table-wrap">.*?</div>\s*\) : \(',
              '''{comparables.length ? (
            <div className="results-page embedded-listing-results">
              <div className="results-grid">
                {comparables.map((listing) => (
                  <MarketplaceListingCard key={listing.sourceRef} listing={listing} />
                ))}
              </div>
            </div>
          ) : (''',
              'county value comparable cards',
          )

          # Seller market-pricing guidance.
          add_after(
              'components/MarketPricingGuidance.tsx',
              'import { useEffect, useState } from "react";\n\n',
              'import type { Listing } from "@/data/listings";\nimport MarketplaceListingCard from "./MarketplaceListingCard";\n',
              'seller guidance card imports',
          )
          text = load('components/MarketPricingGuidance.tsx')
          text = text.replace(
              'type ComparableListing = {\n  reference: string;\n  county: string;\n  licenseType: string;',
              'type ComparableListing = {\n  reference: string;\n  county: string;\n  licenseType: Listing["type"];',
              1,
          )
          save('components/MarketPricingGuidance.tsx', text)
          sub(
              'components/MarketPricingGuidance.tsx',
              r'\{guidance\.comparables\.length \? \(\s*<div className=\{styles\.tableWrap\}>.*?</div>\s*\) : \(',
              '''{guidance.comparables.length ? (
                  <div className="results-page embedded-listing-results listing-cards-one">
                    <div className="results-grid">
                      {guidance.comparables.map((listing, index) => (
                        <MarketplaceListingCard
                          key={`${listing.reference}-${listing.askingPrice}-${index}`}
                          listing={{
                            county: listing.county,
                            type: listing.licenseType,
                            price: listing.askingPrice,
                            priceLabel: currency(listing.askingPrice),
                            sourceRef: listing.reference,
                            licenseStatus: listing.status,
                            image: "/assets/license-market/license-01.png",
                          }}
                        />
                      ))}
                    </div>
                  </div>
                ) : (''',
              'seller guidance comparable cards',
          )
          add_after(
              'app/sell-your-license/page.tsx',
              'import "@/app/sell-your-license-preview/list-your-license-preview.css";\n',
              'import "@/app/listings/listing-card-system.css";\n',
              'seller page stylesheet system',
          )

          Path('.github/workflows/audit-listing-presentations.yml').unlink(missing_ok=True)
          PY

      - name: Stop when already applied
        run: |
          if git diff --quiet; then
            echo "NO_CHANGES=true" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        if: env.NO_CHANGES != 'true'
        run: npm ci --no-audit --no-fund

      - name: Build the site
        if: env.NO_CHANGES != 'true'
        run: npm run build

      - name: Commit and deploy
        if: env.NO_CHANGES != 'true'
        run: |
          git config user.name "Zeitgeist23"
          git config user.email "JWigg023@gmail.com"
          git add -A
          git commit -m "Unify core listing cards sitewide [listing-card-core]"
          git push origin main
