name: Unify listing cards phase 1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[listing-phase1]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the canonical listings-page card everywhere inventory is presented
        run: python scripts/unify_listing_cards_phase1.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build every route
        run: npm run build

      - name: Commit the verified refactor
        run: |
          git config user.name "Zeitgeist23"
          git config user.email "JWigg023@gmail.com"
          git add -A
          git commit -m "Unify core listing cards sitewide [listing-phase1]"
          git push origin main
