          replace_once(
              'components/HomePage.tsx',
              '''  const filteredListings = useMemo(() => {
              if (!searchActive) return listings;
              return listings.filter((listing) => {
                const countyMatch = county === "all" || listing.county === county;
                const typeMatch = licenseType === "all" || listing.type === licenseType;
                const priceMatch = priceRange === "all" || (priceRange === "under350" && listing.price < 350000) || (priceRange === "350to500" && listing.price >= 350000 && listing.price <= 500000) || (priceRange === "over500" && listing.price > 500000);
                return countyMatch && typeMatch && priceMatch;
              });
            }, [county, licenseType, priceRange, searchActive]);''',
              '''  const homepageListings = useMemo(
              () => marketListings.filter((listing) => Boolean(listing.sourceRef)),
              [marketListings],
            );

            const filteredListings = useMemo(() => {
              if (!searchActive) return homepageListings;
              return homepageListings.filter((listing) => {
                const countyMatch = county === "all" || listing.county === county;
                const typeMatch = licenseType === "all" || listing.type === licenseType;
                const priceMatch = priceRange === "all" ||
                  (listing.price !== null && priceRange === "under350" && listing.price < 350000) ||
                  (listing.price !== null && priceRange === "350to500" && listing.price >= 350000 && listing.price <= 500000) ||
                  (listing.price !== null && priceRange === "over500" && listing.price > 500000);
                return countyMatch && typeMatch && priceMatch;
              });
            }, [county, homepageListings, licenseType, priceRange, searchActive]);'''
          )
          regex_once(
              'components/HomePage.tsx',
              r'\n  function toggleSaved\(name: string\) \{.*?\n  \}\n',
              '\n'
          )
          text = read('components/HomePage.tsx')
          text = text.replace('new Set(listings.map((listing) => listing.county))', 'new Set(homepageListings.map((listing) => listing.county))')
          write('components/HomePage.tsx', text)
          regex_once(
              'components/HomePage.tsx',
              r'        <div className="listing-carousel">.*?</div><button className="carousel-arrow next" type="button" aria-label="Next listings" onClick=\{\(\) => setCarouselOffset\(\(value\) => value \+ 1\)\}>›</button></div>',
              '''        <div className="listing-carousel">
              <button className="carousel-arrow previous" type="button" aria-label="Previous listings" onClick={() => setCarouselOffset((value) => value - 1)}>‹</button>
              <div className="results-page embedded-listing-results homepage-listing-results">
                <div className="results-grid">
                  {orderedListings.slice(0, 3).map((listing) => (
                    <MarketplaceListingCard
                      key={listing.sourceRef ?? `${listing.county}-${listing.type}-${listing.priceLabel}`}
                      listing={listing}
                    />
                  ))}
                </div>
              </div>
              <button className="carousel-arrow next" type="button" aria-label="Next listings" onClick={() => setCarouselOffset((value) => value + 1)}>›</button>
            </div>'''
          )
          regex_once(
              'components/HomePage.tsx',
              r'      \{marketInsightsOpen && <div className="market-list-modal-backdrop".*?</section></div>\}',
              '''      {marketInsightsOpen && (
              <div className="market-list-modal-backdrop" onMouseDown={(event) => { if (event.target === event.currentTarget) setMarketInsightsOpen(false); }}>
                <section className="market-list-modal" role="dialog" aria-modal="true" aria-labelledby="market-list-modal-title">
                  <header>
                    <div>
                      <span>Florida Market Insights</span>
                      <h2 id="market-list-modal-title">Current Available Licenses</h2>
                      <p>{pricedMarketListings.length} available listing{pricedMarketListings.length === 1 ? "" : "s"}, ordered from highest to lowest asking price.</p>
                    </div>
                    <button type="button" aria-label="Close current available licenses" onClick={() => setMarketInsightsOpen(false)}>×</button>
                  </header>
                  <div className="market-list-scroll results-page embedded-listing-results listing-cards-two">
                    <div className="results-grid">
                      {pricedMarketListings.map((listing) => (
                        <MarketplaceListingCard
