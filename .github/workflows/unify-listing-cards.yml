                          <Link className="btn offer-button" href={`/submit-offer?listing=${encodeURIComponent(`${listing.county} ${listing.type}`)}&ref=${listing.sourceRef}`}>Submit an Offer</Link>
                        </div>
                      </div>
                    </article>
                  ))}
                </div>
              </div>''',
              '''            <div className="results-page embedded-listing-results seo-market-preview-results">
                <div className="results-grid">
                  {previewListings.map((listing) => (
                    <MarketplaceListingCard
                      key={listing.sourceRef ?? `${listing.county}-${listing.type}-${listing.priceLabel}`}
                      listing={listing}
                    />
                  ))}
                </div>
              </div>'''
          )
          text = read('app/florida-3ps-liquor-license-for-sale/page.tsx')
          text = text.replace('import InventoryCardExpansion from "@/components/InventoryCardExpansion";\n', '')
          text = text.replace('      <InventoryCardExpansion />\n', '')
          write('app/florida-3ps-liquor-license-for-sale/page.tsx', text)

          # Main value estimator comparable listings become the same cards.
          replace_once(
              'components/LiquorLicenseValueEstimator.tsx',
              '''import Link from "next/link";
          import { useRouter } from "next/navigation";
          import { useState } from "react";''',
              'import { useState } from "react";'
          )
          replace_once(
              'components/LiquorLicenseValueEstimator.tsx',
              '''import { listingPageHref } from "@/lib/listing-page-urls";
          import interactionStyles from "./ComparableListingRows.module.css";
          import styles from "./LiquorLicenseValueEstimator.module.css";''',
              '''import MarketplaceListingCard from "./MarketplaceListingCard";
          import styles from "./LiquorLicenseValueEstimator.module.css";'''
          )
          replace_once(
              'components/LiquorLicenseValueEstimator.tsx',
              '  const router = useRouter();\n',
              ''
          )
          replace_once(
              'components/LiquorLicenseValueEstimator.tsx',
              '''          {guidance.comparables.length > 0 ? (
              <div className={styles.tableWrap}>
                <table>
                  <thead><tr><th>Listing</th><th>License type</th><th>Status</th><th>Asking price</th></tr></thead>
                  <tbody>
                    {guidance.comparables.map((listing, index) => {
                      const href = listingPageHref({
                        county: listing.county,
                        type: listing.licenseType,
                        sourceRef: listing.reference,
                      });

                      return (
                        <tr
                          className={interactionStyles.clickableRow}
                          key={`${listing.reference}-${listing.askingPrice}-${index}`}
                          onClick={(event) => {
                            const target = event.target as HTMLElement;
                            if (target.closest("a, button, input, select, textarea")) return;
                            router.push(href);
                          }}
                          onMouseEnter={() => router.prefetch(href)}
                        >
                          <td>
                            <Link
                              className={interactionStyles.referenceLink}
                              href={href}
                              onFocus={() => router.prefetch(href)}
                              aria-label={`View ${listing.reference} listing details`}
                            >
                              <span>{listing.reference}</span>
                              <span className={interactionStyles.viewCue} aria-hidden="true">View listing <b>→</b></span>
                            </Link>
                          </td>
                          <td>{listing.licenseType}</td>
                          <td>{listing.status}</td>
                          <td><strong>{currency(listing.askingPrice)}</strong></td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            ) : (''',
              '''          {guidance.comparables.length > 0 ? (
              <div className="results-page embedded-listing-results listing-cards-two">
                <div className="results-grid">
                  {guidance.comparables.map((listing, index) => (
                    <MarketplaceListingCard
                      key={`${listing.reference}-${listing.askingPrice}-${index}`}
                      listing={{
                        county: listing.county,
                        type: listing.licenseType,
                        price: listing.askingPrice,
                        priceLabel: currency(listing.askingPrice),
                        sourceRef: listing.reference,
                        licenseStatus: listing.status,
                        image: "/assets/license-market/license-01.png",
                      }}
                    />
                  ))}
                </div>
              </div>
            ) : ('''
          )

          # Load the canonical card system wherever the estimator is rendered.
          replace_once(
              'app/florida-liquor-license-value/page.tsx',
              'import "./value-page.css";\n',
              'import "./value-page.css";\nimport "@/app/listings/listing-card-system.css";\n'
          )

          # County value guides use the same cards, not a separate listing table.
          replace_once(
              'app/counties/[slug]/liquor-license-value/page.tsx',
              'import FormsSiteHeader from "@/components/FormsSiteHeader";\n',
              'import FormsSiteHeader from "@/components/FormsSiteHeader";\nimport MarketplaceListingCard from "@/components/MarketplaceListingCard";\n'
          )
          replace_once(
              'app/counties/[slug]/liquor-license-value/page.tsx',
              'import "./county-value-page.css";\n',
              'import "./county-value-page.css";\nimport "@/app/listings/listing-card-system.css";\n'
          )
          replace_once(
              'app/counties/[slug]/liquor-license-value/page.tsx',
              '''        {comparables.length ? (
            <div className="county-value-table-wrap">
              <table>
                <thead><tr><th>Listing</th><th>License type</th><th>Market status</th><th>Disclosed ask</th><th>Details</th></tr></thead>
                <tbody>
                  {comparables.map((listing) => (
                    <tr key={listing.sourceRef}>
                      <td>{listing.sourceRef}</td>
                      <td>{listing.type}</td>
                      <td>Available</td>
                      <td><strong>{money(listing.price)}</strong></td>
                      <td><Link href={listingPageHref(listing)}>View listing ›</Link></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          ) : (''',
              '''        {comparables.length ? (
            <div className="results-page embedded-listing-results">
              <div className="results-grid">
                {comparables.map((listing) => (
                  <MarketplaceListingCard key={listing.sourceRef} listing={listing} />
                ))}
              </div>
            </div>
          ) : ('''
          )

          # Seller-side market guidance uses the same card component.
          replace_once(
              'components/MarketPricingGuidance.tsx',
              'import { useEffect, useState } from "react";\n\nimport styles from "./MarketPricingGuidance.module.css";\n',
              'import { useEffect, useState } from "react";\n\nimport type { Listing } from "@/data/listings";\nimport MarketplaceListingCard from "./MarketplaceListingCard";\nimport styles from "./MarketPricingGuidance.module.css";\n'
          )
          replace_once(
              'components/MarketPricingGuidance.tsx',
              '  licenseType: string;\n',
              '  licenseType: Listing["type"];\n'
          )
          replace_once(
              'components/MarketPricingGuidance.tsx',
              '''                {guidance.comparables.length ? (
                    <div className={styles.tableWrap}>
                      <table className={styles.table}>
                        <thead>
                          <tr>
                            <th>Listing</th>
                            <th>License type</th>
                            <th>Status</th>
                            <th>Asking price</th>
                          </tr>
                        </thead>
                        <tbody>
                          {guidance.comparables.map((listing, index) => (
                            <tr key={`${listing.reference}-${listing.askingPrice}-${index}`}>
                              <td>{listing.reference}</td>
                              <td>{listing.licenseType}</td>
                              <td><span className={styles.status}>{listing.status}</span></td>
                              <td className={styles.tablePrice}>{currency(listing.askingPrice)}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  ) : (''',
              '''                {guidance.comparables.length ? (
                    <div className="results-page embedded-listing-results listing-cards-one">
                      <div className="results-grid">
                        {guidance.comparables.map((listing, index) => (
                          <MarketplaceListingCard
                            key={`${listing.reference}-${listing.askingPrice}-${index}`}
                            listing={{
                              county: listing.county,
                              type: listing.licenseType,
                              price: listing.askingPrice,
                              priceLabel: currency(listing.askingPrice),
                              sourceRef: listing.reference,
                              licenseStatus: listing.status,
                              image: "/assets/license-market/license-01.png",
                            }}
                          />
                        ))}
                      </div>
                    </div>
                  ) : ('''
          )
          replace_once(
              'app/sell-your-license/page.tsx',
              'import "@/app/sell-your-license-preview/list-your-license-preview.css";\n',
              'import "@/app/sell-your-license-preview/list-your-license-preview.css";\nimport "@/app/listings/listing-card-system.css";\n'
          )

          # Homepage featured inventory now uses live listings and the same cards.
          replace_once(
              'components/HomePage.tsx',
              'import HomeMarketInsightsMap from "./HomeMarketInsightsMap";\n',
              'import HomeMarketInsightsMap from "./HomeMarketInsightsMap";\nimport MarketplaceListingCard from "./MarketplaceListingCard";\n'
          )
          regex_once(
              'components/HomePage.tsx',
              r'type FeaturedListing = \{.*?\n\];\n\nconst transactions',
              'const transactions'
