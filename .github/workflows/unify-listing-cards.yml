                    </div>
                  </div>
                  <footer><span>Prices and availability are subject to confirmation.</span><a href="/listings">Open Full Listings Page ›</a></footer>
                </section>
              </div>
            )}'''
          )
          replace_once(
              'app/page.tsx',
              'import "./home-market-insights.css";\n',
              'import "./home-market-insights.css";\nimport "./listings/listing-card-system.css";\n'
          )

          # The temporary audit has served its purpose.
          Path('.github/workflows/audit-listing-presentations.yml').unlink(missing_ok=True)
          PY

      - name: Stop when the refactor is already applied
        run: |
          if git diff --quiet; then
            echo "No listing-card changes remain to apply."
            echo "NO_CHANGES=true" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        if: env.NO_CHANGES != 'true'
        run: npm ci --no-audit --no-fund

      - name: Build the complete site
        if: env.NO_CHANGES != 'true'
        run: npm run build

      - name: Commit the unified listing system
        if: env.NO_CHANGES != 'true'
        run: |
          git config user.name "Zeitgeist23"
          git config user.email "JWigg023@gmail.com"
          git add -A
          git commit -m "Unify listing cards sitewide [listing-card-system]"
          git push origin main
