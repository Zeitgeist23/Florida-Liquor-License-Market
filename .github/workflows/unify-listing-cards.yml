name: Unify public listing cards

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[listing-card-system]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the shared listings-page card component everywhere public listings appear
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact match, found {count}')
              write(path, text.replace(old, new, 1))

          def regex_once(path, pattern, replacement):
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: expected one regex match, found {count}')
              write(path, updated)

          # /listings is the source of truth for every card stylesheet.
          replace_once(
              'app/listings/page.tsx',
              '''import "./listings-premium.css";
          import "./listings-header-position.css";
          import "./listings-map-size.css";
          import "./listings-county-links.css";
          import "./listings-navy-refresh.css";
          import "./listings-card-gold-borders.css";
          import "./listings-title-highlight.css";
          import "./listings-regression-fix.css";
          import "./listings-filter-depth.css";
          import "./listings-logo-3pct-lock.css";
          import "./listings-conversion-cards.css";
          import "./listings-card-overlap-fix.css";
          import "./listings-masthead-darker.css";
          import "./listings-mobile-header-fix.css";
          import "./listings-seo-footer.css";''',
              'import "./listing-card-system.css";'
          )

          # County inventory cards use the exact component and exact stylesheet stack.
          replace_once(
              'app/counties/[slug]/page.tsx',
              'import FloridaCountyMap from "@/components/FloridaCountyMap";\n',
              'import FloridaCountyMap from "@/components/FloridaCountyMap";\nimport MarketplaceListingCard from "@/components/MarketplaceListingCard";\n'
          )
          replace_once(
              'app/counties/[slug]/page.tsx',
              '''import "./county-page.css";
          import "../../listings/listings-premium.css";
          import "../../listings/listings-map-size.css";
          import "../../listings/listings-county-links.css";
          import "../../listings/listings-conversion-cards.css";
          import "../../listings/listings-card-overlap-fix.css";''',
              '''import "./county-page.css";
          import "../../listings/listing-card-system.css";'''
          )
          replace_once(
              'app/counties/[slug]/page.tsx',
              '''                {available.map((listing) => (
                    <article className="result-card result-card-available" id={listing.sourceRef} key={listingKey(listing)}>
                      <span className="result-type-badge">{listing.type}</span>
                      <div className="result-photo"><FloridaCountyMap county={listing.county} enlarged /></div>
                      <div className="result-body">
                        <p className="result-county-row"><span className="result-pin" aria-hidden="true">●</span><Link className="result-county-link" href={`/counties/${county.slug}`}>{listing.county}</Link></p>
                        <h2><Link href={listingPageHref(listing)} aria-label={`View ${listing.type} listing in ${listing.county}`} style={{ color: "inherit", textDecoration: "none" }}>{listing.priceLabel}</Link></h2>
                        <div className="result-facts">
                          <span className="availability-pill" title={listing.licenseStatus ? sellerReportedStatusLabel(listing.licenseStatus) : "Status to confirm"}><span className="availability-dot" aria-hidden="true" />Available</span>
                        </div>
                        <ListingDescription listing={listing} />
                        <div className="result-actions">
                          <Link className="btn btn-gold result-view-button" href={listingPageHref(listing)}>View License <span aria-hidden="true">›</span></Link>
                        </div>
                      </div>
                    </article>
                  ))}''',
              '''                {available.map((listing) => (
                    <MarketplaceListingCard
                      id={listing.sourceRef}
                      key={listingKey(listing)}
                      listing={listing}
                    />
                  ))}'''
          )

          # 4COP inventory cards.
          replace_once(
