name: Update Saint Augustine Market Scope

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-saint-augustine-market-scope.yml"
      - "scripts/update-saint-augustine-market-scope.mjs"
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PDF text tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Refresh DBPR snapshot
        run: node scripts/update-saint-augustine-market-scope.mjs
      - name: Commit snapshot if changed
        run: |
          if git diff --quiet -- data/market-scope/saint-augustine-dbpr.json; then
            echo "No DBPR snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-scope/saint-augustine-dbpr.json
          git commit -m "Refresh Saint Augustine DBPR Market Scope snapshot"
          git push
