name: Verify definitive live heat map repair

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install browser dependency
        run: npm install --no-save --no-package-lock --ignore-scripts puppeteer-core@24.16.0

      - name: Test exact live user paths
        run: |
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          const SITE = 'https://www.floridaliquorlicensemarket.com';

          function clean(value) {
            return String(value || '').replace(/\s+/g, ' ').trim();
          }

          async function loadReady(page, path, readyPredicate, label) {
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              await page.goto(`${SITE}${path}${path.includes('?') ? '&' : '?'}verify=${Date.now()}`, {
                waitUntil: 'networkidle2',
                timeout: 90000,
              });
              const ready = await page.evaluate(readyPredicate).catch(() => false);
              if (ready) return;
              console.log(`${label} not ready on attempt ${attempt}; retrying.`);
              await sleep(6000);
            }
            throw new Error(`${label} did not expose the direct-render heat-map assets.`);
          }

          async function getFirstListing(page) {
            return page.evaluate(async () => {
              const response = await fetch(`/api/market-insights-listings?verify=${Date.now()}`, { cache: 'no-store' });
              if (!response.ok) throw new Error(`market insights API returned ${response.status}`);
              const payload = await response.json();
              return (Array.isArray(payload.listings) ? payload.listings : [])
                .find((listing) => listing?.sourceRef && listing?.county && /^\/listings\//.test(listing?.href || '')) || null;
            });
          }

          async function clickVisibleText(page, selector, text) {
            const handles = await page.$$(selector);
            for (const handle of handles) {
              const state = await handle.evaluate((element) => {
                const rect = element.getBoundingClientRect();
                const style = getComputedStyle(element);
                return {
                  text: (element.textContent || '').replace(/\s+/g, ' ').trim(),
                  visible: rect.width > 0 && rect.height > 0 && style.display !== 'none' && style.visibility !== 'hidden',
                };
              });
              if (state.visible && state.text.toLowerCase() === text.toLowerCase()) {
                await handle.click();
                return true;
              }
            }
            return false;
          }

          async function clickCounty(page, countyName) {
            const bareCounty = clean(countyName).replace(/\s+County$/i, '');
            await page.waitForSelector('.fllm-heat-map-modal path[data-heat-map-county]', { timeout: 30000 });
            const clicked = await page.evaluate((county) => {
              const path = Array.from(document.querySelectorAll('.fllm-heat-map-modal path[data-heat-map-county]'))
                .find((candidate) => cleanText(candidate.getAttribute('data-heat-map-county')).toLowerCase() === county.toLowerCase());
              function cleanText(value) { return String(value || '').replace(/\s+/g, ' ').trim(); }
              if (!path) return false;
              path.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window }));
              return true;
            }, bareCounty);
            if (!clicked) throw new Error(`Heat-map county path not found for ${bareCounty}.`);
            await page.waitForSelector('.fllm-county-listings-dialog', { timeout: 30000 });
            await sleep(350);
          }

          async function mainCardStyle(page) {
            return page.$eval('.results-grid .result-card', (card) => {
              const county = card.querySelector('.result-county-row');
              const price = card.querySelector('.result-body > h2');
              const button = card.querySelector('.result-view-button');
              const badge = card.querySelector('.result-type-badge');
              const styleOf = (element) => element ? getComputedStyle(element) : null;
              const cardStyle = getComputedStyle(card);
              const countyStyle = styleOf(county);
              const priceStyle = styleOf(price);
              const buttonStyle = styleOf(button);
              const badgeStyle = styleOf(badge);
              return {
                card: {
                  backgroundImage: cardStyle.backgroundImage,
                  borderColor: cardStyle.borderColor,
                  borderRadius: cardStyle.borderRadius,
                  display: cardStyle.display,
                  gridTemplateColumns: cardStyle.gridTemplateColumns,
                },
                county: countyStyle && {
                  color: countyStyle.color,
                  fontFamily: countyStyle.fontFamily,
                  fontSize: countyStyle.fontSize,
                  fontWeight: countyStyle.fontWeight,
                  textTransform: countyStyle.textTransform,
                },
                price: priceStyle && {
                  color: priceStyle.color,
                  fontSize: priceStyle.fontSize,
                  fontWeight: priceStyle.fontWeight,
                },
                button: buttonStyle && {
                  backgroundImage: buttonStyle.backgroundImage,
                  color: buttonStyle.color,
                  minHeight: buttonStyle.minHeight,
                  borderRadius: buttonStyle.borderRadius,
                  textTransform: buttonStyle.textTransform,
                },
                badge: badgeStyle && {
                  color: badgeStyle.color,
                  backgroundColor: badgeStyle.backgroundColor,
                  borderColor: badgeStyle.borderColor,
                  textTransform: badgeStyle.textTransform,
                },
              };
            });
          }

          async function heatCardState(page, reference) {
            return page.evaluate((targetReference) => {
              const dialog = document.querySelector('.fllm-county-listings-dialog');
              const cards = Array.from(dialog?.querySelectorAll('.fllm-popup-card-shell.results-page .result-card') || []);
              const card = cards.find((candidate) => clean(candidate.getAttribute('data-listing-reference')).toLowerCase() === targetReference.toLowerCase()) || cards[0];
              function clean(value) { return String(value || '').replace(/\s+/g, ' ').trim(); }
              if (!card) return null;

              const county = card.querySelector('.result-county-row');
              const countyLink = card.querySelector('.result-county-link');
              const price = card.querySelector('.result-body > h2');
              const button = card.querySelector('.result-view-button');
              const badge = card.querySelector('.result-type-badge');
              const cardStyle = getComputedStyle(card);
              const countyStyle = county ? getComputedStyle(county) : null;
              const priceStyle = price ? getComputedStyle(price) : null;
              const buttonStyle = button ? getComputedStyle(button) : null;
              const badgeStyle = badge ? getComputedStyle(badge) : null;

              return {
                reference: clean(card.getAttribute('data-listing-reference')),
                dataHref: clean(card.getAttribute('data-listing-href')),
                buttonHref: button instanceof HTMLAnchorElement ? new URL(button.href, location.origin).pathname : '',
                countyText: clean(countyLink?.textContent),
                oldCardCount: dialog?.querySelectorAll('.fllm-county-listing-card').length || 0,
                currentCardCount: cards.length,
                syncScriptCount: Array.from(document.scripts).filter((script) => script.src.includes('market-heat-map-listings-card-sync')).length,
                scriptSources: Array.from(document.scripts).map((script) => script.src).filter((src) => /market-heat-map/.test(src)),
                style: {
                  card: {
                    backgroundImage: cardStyle.backgroundImage,
                    borderColor: cardStyle.borderColor,
                    borderRadius: cardStyle.borderRadius,
                    display: cardStyle.display,
                    gridTemplateColumns: cardStyle.gridTemplateColumns,
                  },
                  county: countyStyle && {
                    color: countyStyle.color,
                    fontFamily: countyStyle.fontFamily,
                    fontSize: countyStyle.fontSize,
                    fontWeight: countyStyle.fontWeight,
                    textTransform: countyStyle.textTransform,
                  },
                  price: priceStyle && {
                    color: priceStyle.color,
                    fontSize: priceStyle.fontSize,
                    fontWeight: priceStyle.fontWeight,
                  },
                  button: buttonStyle && {
                    backgroundImage: buttonStyle.backgroundImage,
                    color: buttonStyle.color,
                    minHeight: buttonStyle.minHeight,
                    borderRadius: buttonStyle.borderRadius,
                    textTransform: buttonStyle.textTransform,
                  },
                  badge: badgeStyle && {
                    color: badgeStyle.color,
                    backgroundColor: badgeStyle.backgroundColor,
                    borderColor: badgeStyle.borderColor,
                    textTransform: badgeStyle.textTransform,
                  },
                },
              };
            }, reference);
          }

          function assertSameStyle(actual, expected, locationLabel) {
            const differences = [];
            for (const section of ['card', 'county', 'price', 'button', 'badge']) {
              for (const [property, expectedValue] of Object.entries(expected[section] || {})) {
                const actualValue = actual?.[section]?.[property];
                if (actualValue !== expectedValue) differences.push(`${section}.${property}: ${actualValue} != ${expectedValue}`);
              }
            }
            if (differences.length) {
              throw new Error(`${locationLabel} is not identical to the Listings-page card treatment: ${differences.join('; ')}`);
            }
          }

          async function openListingsHeatMap(page) {
            if (!await clickVisibleText(page, '.results-filters button', 'Heat Map')) {
              throw new Error('The visible Listings-page Heat Map button was not found.');
            }
            await page.waitForSelector('.fllm-heat-map-modal', { timeout: 30000 });
          }

          async function openHomepageHeatMap(page) {
            const opened = await page.evaluate(() => {
              const trigger = Array.from(document.querySelectorAll('.primary-nav a'))
                .find((link) => (link.textContent || '').replace(/\s+/g, ' ').trim().toLowerCase() === 'market data');
              if (!(trigger instanceof HTMLElement)) return false;
              trigger.click();
              return true;
            });
            if (!opened) throw new Error('The homepage Market Data trigger was not found.');
            await sleep(250);
            if (!await clickVisibleText(page, '.market-data-header-menu button, #market-data-header-menu button', 'Heat Map')) {
              throw new Error('The visible homepage Heat Map option was not found.');
            }
            await page.waitForSelector('.fllm-heat-map-modal', { timeout: 30000 });
          }

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME_PATH || '/usr/bin/google-chrome',
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });

            try {
              const listingsPage = await browser.newPage();
              await listingsPage.setViewport({ width: 1700, height: 1000 });
              listingsPage.on('pageerror', (error) => console.log(`LISTINGS PAGE ERROR: ${error.message}`));
              await loadReady(
                listingsPage,
                '/listings',
                () => Boolean(document.querySelector('.results-grid .result-card')),
                'Listings page',
              );

              const record = await getFirstListing(listingsPage);
              if (!record) throw new Error('No canonical live listing record was available for testing.');
              const baseline = await mainCardStyle(listingsPage);

              await openListingsHeatMap(listingsPage);
              await clickCounty(listingsPage, record.county);
              const listingsHeatCard = await heatCardState(listingsPage, record.sourceRef);
              console.log('LISTINGS HEAT CARD:', JSON.stringify(listingsHeatCard, null, 2));
              if (!listingsHeatCard) throw new Error('Listings heat map did not render a current-format listing card.');
              if (listingsHeatCard.oldCardCount !== 0) throw new Error('Listings heat map still rendered old-format cards.');
              if (listingsHeatCard.syncScriptCount !== 0) throw new Error('Listings heat map still loaded the deferred card-conversion script.');
              if (listingsHeatCard.reference !== record.sourceRef) throw new Error(`Listings heat-map reference mismatch: ${listingsHeatCard.reference} vs ${record.sourceRef}`);
              if (listingsHeatCard.buttonHref !== record.href) throw new Error(`Listings heat-map link mismatch: ${listingsHeatCard.buttonHref} vs ${record.href}`);
              assertSameStyle(listingsHeatCard.style, baseline, 'Listings heat map');
              await listingsPage.screenshot({ path: 'listings-direct-heat-map.png' });

              const clicked = await listingsPage.evaluate((reference) => {
                const card = Array.from(document.querySelectorAll('.fllm-county-listings-dialog .result-card'))
                  .find((candidate) => (candidate.getAttribute('data-listing-reference') || '').toLowerCase() === reference.toLowerCase());
                const button = card?.querySelector('.result-view-button');
                if (!(button instanceof HTMLAnchorElement)) return false;
                button.click();
                return true;
              }, record.sourceRef);
              if (!clicked) throw new Error('Could not click the selected heat-map View License button.');

              await listingsPage.waitForFunction((expectedPath) => location.pathname === expectedPath, { timeout: 30000 }, record.href);
              await listingsPage.waitForSelector('.result-card-focused', { timeout: 30000 });
              await sleep(800);
              const destination = await listingsPage.evaluate((expectedReference) => {
                const focused = document.querySelector('.result-card-focused');
                if (!focused) return null;
                const rect = focused.getBoundingClientRect();
                return {
                  pathname: location.pathname,
                  reference: focused.getAttribute('data-listing-reference') || '',
                  selectedLabel: getComputedStyle(focused, '::before').content,
                  inViewport: rect.bottom > 0 && rect.top < window.innerHeight,
                  focusedCount: document.querySelectorAll('.result-card-focused').length,
                };
              }, record.sourceRef);
              console.log('INDIVIDUAL DESTINATION:', JSON.stringify(destination, null, 2));
              if (!destination) throw new Error('The individual listing destination did not identify a selected card.');
              if (destination.pathname !== record.href) throw new Error(`View License opened ${destination.pathname} instead of ${record.href}.`);
              if (destination.reference !== record.sourceRef) throw new Error(`The destination focused ${destination.reference} instead of ${record.sourceRef}.`);
              if (!/Selected License/i.test(destination.selectedLabel)) throw new Error(`The selected-license marker is missing: ${destination.selectedLabel}`);
              if (!destination.inViewport) throw new Error('The selected individual license did not scroll into view.');
              if (destination.focusedCount !== 1) throw new Error(`Expected exactly one selected license; found ${destination.focusedCount}.`);
              await listingsPage.screenshot({ path: 'individual-selected-license.png' });

              const homePage = await browser.newPage();
              await homePage.setViewport({ width: 1700, height: 1000 });
              homePage.on('pageerror', (error) => console.log(`HOME PAGE ERROR: ${error.message}`));
              await loadReady(
                homePage,
                '/',
                () => Array.from(document.scripts).some((script) => script.src.includes('market-heat-map.js?v=5')),
                'Homepage direct heat map',
              );
              await openHomepageHeatMap(homePage);
              await clickCounty(homePage, record.county);
              const homeHeatCard = await heatCardState(homePage, record.sourceRef);
              console.log('HOME HEAT CARD:', JSON.stringify(homeHeatCard, null, 2));
              if (!homeHeatCard) throw new Error('Homepage heat map did not render a current-format listing card.');
              if (homeHeatCard.oldCardCount !== 0) throw new Error('Homepage heat map still rendered old-format cards.');
              if (homeHeatCard.syncScriptCount !== 0) throw new Error('Homepage heat map still loaded the deferred card-conversion script.');
              if (homeHeatCard.reference !== record.sourceRef) throw new Error(`Homepage heat-map reference mismatch: ${homeHeatCard.reference} vs ${record.sourceRef}`);
              if (homeHeatCard.buttonHref !== record.href) throw new Error(`Homepage heat-map link mismatch: ${homeHeatCard.buttonHref} vs ${record.href}`);
              if (homeHeatCard.countyText !== record.county) throw new Error(`Homepage heat-map county text changed format: ${homeHeatCard.countyText} vs ${record.county}`);
              assertSameStyle(homeHeatCard.style, baseline, 'Homepage heat map');
              await homePage.screenshot({ path: 'homepage-direct-heat-map.png' });

              console.log('PASS: both visible heat-map entry points render the current Listings-page cards directly, every View License link opens the exact selected listing, and the selected listing is visibly marked and in view.');
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error.stack || error);
            process.exit(1);
          });
          NODE

      - name: Upload verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: definitive-heat-map-live-verification
          path: |
            listings-direct-heat-map.png
            individual-selected-license.png
            homepage-direct-heat-map.png
          if-no-files-found: ignore
