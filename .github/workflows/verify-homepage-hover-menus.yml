name: Verify homepage hover menus

on:
  push:
    paths:
      - ".github/workflows/verify-homepage-hover-menus.yml"
      - "public/assets/header-menu-coordinator.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Wait for the updated live coordinator asset
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            body="$(curl -fsSL "https://www.floridaliquorlicensemarket.com/assets/header-menu-coordinator.js?v=2&verify=${GITHUB_SHA}" || true)"
            if grep -q 'OPEN_DELAY_MS = 150' <<<"$body" && grep -q 'suppressFocusOpenUntil' <<<"$body"; then
              echo "Updated coordinator asset is live."
              exit 0
            fi
            echo "Waiting for deployment (${attempt}/30)..."
            sleep 10
          done
          echo "Updated coordinator asset did not become available."
          exit 1

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Test hover, menu transit, switching, closing, and click fallback
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          import assert from "node:assert/strict";

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          page.on("console", (message) => console.log(`[browser:${message.type()}] ${message.text()}`));
          page.on("pageerror", (error) => console.error(`[pageerror] ${error.message}`));

          try {
            await page.goto(`https://www.floridaliquorlicensemarket.com/?verify_hover=${Date.now()}`, {
              waitUntil: "networkidle",
              timeout: 90000,
            });

            const triggerByLabel = (label) => page.locator(".primary-nav a").filter({ hasText: label }).first();
            const marketTrigger = triggerByLabel("Market Data");
            const resourcesTrigger = triggerByLabel("Resources");
            const marketMenu = page.locator(".market-data-header-menu");
            const resourcesMenu = page.locator(".resources-header-menu");

            await marketTrigger.waitFor({ state: "visible", timeout: 30000 });
            await resourcesTrigger.waitFor({ state: "visible", timeout: 30000 });
            await page.waitForFunction(() => {
              const links = Array.from(document.querySelectorAll(".primary-nav a"));
              const ready = (label) => links.find((link) => (link.textContent || "").trim() === label)?.getAttribute("aria-haspopup") === "menu";
              return ready("Market Data") && ready("Resources");
            }, { timeout: 30000 });

            await marketTrigger.hover();
            await page.waitForTimeout(450);
            assert.equal(await marketMenu.isVisible(), true, "Market Data menu did not open on hover");
            assert.equal(await marketTrigger.getAttribute("aria-expanded"), "true", "Market Data trigger was not marked expanded");

            await marketMenu.hover();
            await page.waitForTimeout(400);
            assert.equal(await marketMenu.isVisible(), true, "Market Data menu closed while pointer moved into it");

            await resourcesTrigger.hover();
            await page.waitForTimeout(450);
            assert.equal(await resourcesMenu.isVisible(), true, "Resources menu did not open on hover");
            assert.equal(await resourcesTrigger.getAttribute("aria-expanded"), "true", "Resources trigger was not marked expanded");
            assert.equal(await marketMenu.isVisible(), false, "Market Data menu remained open after switching to Resources");

            await page.mouse.move(20, 650);
            await page.waitForTimeout(500);
            assert.equal(await resourcesMenu.isVisible(), false, "Resources menu did not close after pointer left");

            await marketTrigger.click();
            await page.waitForTimeout(100);
            assert.equal(await marketMenu.isVisible(), true, "Click fallback did not open Market Data menu");
            await page.keyboard.press("Escape");
            await page.waitForTimeout(150);
            assert.equal(await marketMenu.isVisible(), false, "Escape did not close the click-opened Market Data menu");

            console.log("LIVE HOVER MENU TEST PASSED");
          } finally {
            await browser.close();
          }
          NODE
