name: Verify Inquiry Failover Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-inquiry-failover-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify live fallback payload without sending it
        shell: bash
        run: |
          cat > /tmp/verify-failover.cjs <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            let apiResult = null;
            let fallbackRequest = null;

            page.on('response', async response => {
              if (response.url().includes('/api/inquiry')) {
                let body = '';
                try { body = await response.text(); } catch {}
                apiResult = { status: response.status(), body };
              }
            });

            await page.route('https://formsubmit.co/**', async route => {
              const req = route.request();
              if (req.method() === 'POST') {
                fallbackRequest = { url: req.url(), method: req.method(), postData: req.postData() || '' };
              }
              await route.abort();
            });

            const params = new URLSearchParams({
              source: 'specific-license',
              listing: 'FLLM-168405 — Sarasota County — 3PS Quota / Package Store — $550,000',
              ref: 'FLLM-168405', county: 'Sarasota County',
              license_type: '3PS Quota / Package Store', asking_price: '$550,000',
              listing_status: 'Active / Available', listing_url: '/listings/FLLM-168405',
            });

            await page.goto(`https://www.floridaliquorlicensemarket.com/contact?${params}`, { waitUntil: 'networkidle', timeout: 90000 });
            const form = page.locator('form.contact-page-form');
            await form.waitFor();
            await form.locator('input[name="name"]').fill('James Wigg');
            await form.locator('input[name="email"]').fill('jwigg023@gmail.com');
            await form.locator('select[name="inquiry_type"]').selectOption({ label: 'Buy a License' });
            await form.locator('select[name="preferred_county"]').selectOption({ label: 'Sarasota County' });
            await form.locator('textarea[name="message"]').fill('CONTROLLED FAILOVER VERIFICATION — intercepted before FormSubmit delivery.');
            await form.locator('button[type="submit"]').click();

            for (let i = 0; i < 150 && !fallbackRequest; i++) await page.waitForTimeout(100);

            console.log('API_RESULT', JSON.stringify(apiResult));
            console.log('FALLBACK_URL', fallbackRequest?.url);
            console.log('FALLBACK_POST', fallbackRequest?.postData);

            assert(apiResult, 'No /api/inquiry response captured');
            assert.strictEqual(apiResult.status, 502, `Expected 502 handoff, got ${apiResult.status}`);
            const apiJson = JSON.parse(apiResult.body);
            assert.deepStrictEqual([...apiJson.fallbackCc].sort(), ['jwigg023@gmail.com','vraj.pat2004@gmail.com'].sort());
            assert.strictEqual(apiJson.fallbackSellerContact.email, 'vraj.pat2004@gmail.com');
            assert.strictEqual(apiJson.fallbackSellerContact.phone, '(561) 529-1694');

            assert(fallbackRequest, 'No FormSubmit fallback request captured');
            assert.strictEqual(fallbackRequest.url, 'https://formsubmit.co/listings@floridaliquorlicensemarket.com');
            const decoded = decodeURIComponent(fallbackRequest.postData.replace(/\+/g, ' '));
            assert(decoded.includes('FLLM-168405'), 'Listing reference missing from fallback');
            assert(decoded.includes('vraj.pat2004@gmail.com'), 'Vraj email missing from fallback');
            assert(decoded.includes('jwigg023@gmail.com'), 'Buyer email missing from fallback');
            assert(decoded.includes('(561) 529-1694'), 'Vraj phone missing from fallback');
            assert(!decoded.includes('_captcha=false'), 'CAPTCHA was improperly disabled');
            console.log('VERIFIED_FAILOVER_PAYLOAD=PASS');
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          NODE_PATH="$PWD/node_modules" node /tmp/verify-failover.cjs
