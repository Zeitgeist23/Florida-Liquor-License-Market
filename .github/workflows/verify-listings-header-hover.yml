name: Repair listings menu focus interaction

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[listings-hover-focus-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prevent focus from double-toggling a mouse click
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/ListingsHeaderHoverMenus.tsx')
          text = path.read_text(encoding='utf-8')
          old = '''      if (menuName) {
        clearTimer(closeTimers, menuName);
        openMenu(menuName);
        return;
      }
'''
          new = '''      if (menuName) {
        scheduleOpen(menuName);
        return;
      }
'''

          if old not in text:
              raise SystemExit('Expected focus-in block was not found.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build every route
        run: npm run build

      - name: Commit the verified repair
        run: |
          git config user.name "Zeitgeist23"
          git config user.email "JWigg023@gmail.com"
          git add components/ListingsHeaderHoverMenus.tsx
          git commit -m "Fix listings menu click and focus interaction [listings-hover-focus-fixed]"
          git push origin main
