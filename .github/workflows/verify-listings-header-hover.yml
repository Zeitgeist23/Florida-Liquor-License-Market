name: Repair listings hover menu build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[listings-hover-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct the window blur listener typing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/ListingsHeaderHoverMenus.tsx')
          text = path.read_text(encoding='utf-8')

          old_add = '    window.addEventListener("blur", closeAll);\n'
          new_add = '    const onWindowBlur = () => closeAll();\n\n    window.addEventListener("blur", onWindowBlur);\n'
          old_remove = '      window.removeEventListener("blur", closeAll);\n'
          new_remove = '      window.removeEventListener("blur", onWindowBlur);\n'

          if old_add not in text:
              raise SystemExit('Expected blur add-listener line was not found.')
          if old_remove not in text:
              raise SystemExit('Expected blur remove-listener line was not found.')

          text = text.replace(old_add, new_add, 1).replace(old_remove, new_remove, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build every route
        run: npm run build

      - name: Commit the verified repair
        run: |
          git config user.name "Zeitgeist23"
          git config user.email "JWigg023@gmail.com"
          git add components/ListingsHeaderHoverMenus.tsx
          git commit -m "Fix listings hover menu event typing [listings-hover-fixed]"
          git push origin main
