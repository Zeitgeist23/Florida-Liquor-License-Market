name: Verify live listings hover behavior

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip-listings-hover-test]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock --ignore-scripts puppeteer-core@24.16.0

      - name: Test the live listings header
        run: |
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME_PATH || '/usr/bin/google-chrome',
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });

            try {
              const page = await browser.newPage();
              await page.setViewport({ width: 1600, height: 1000 });
              await page.goto('https://www.floridaliquorlicensemarket.com/listings', {
                waitUntil: 'networkidle2',
                timeout: 90000,
              });

              await page.waitForFunction(() => {
                const labels = Array.from(document.querySelectorAll('.results-header nav a'))
                  .map((link) => (link.textContent || '').replace(/\s+/g, ' ').trim());
                return labels.includes('Market Data') && labels.includes('License Types') && labels.includes('Resources');
              }, { timeout: 30000 });

              await page.evaluate(() => {
                Array.from(document.querySelectorAll('.results-header nav a')).forEach((link) => {
                  const label = (link.textContent || '').replace(/\s+/g, ' ').trim();
                  if (label === 'Market Data') link.setAttribute('data-hover-test', 'market-data');
                  if (label === 'Resources') link.setAttribute('data-hover-test', 'resources');
                });
              });

              await page.waitForFunction(() => {
                const market = document.querySelector('[data-hover-test="market-data"]');
                const resources = document.querySelector('[data-hover-test="resources"]');
                return market?.getAttribute('aria-haspopup') === 'menu' &&
                  resources?.getAttribute('aria-haspopup') === 'menu' &&
                  document.querySelector('[data-listings-header-dropdown="market-data"]') &&
                  document.querySelector('[data-listings-header-dropdown="resources"]');
              }, { timeout: 15000 });

              await page.hover('[data-hover-test="market-data"]');
              await sleep(650);
              const marketOpened = await page.$eval(
                '[data-listings-header-dropdown="market-data"]',
                (menu) => menu.classList.contains('is-open') && menu.getAttribute('aria-hidden') === 'false',
              );
              if (!marketOpened) throw new Error('Market Data did not open on hover.');

              await page.hover('[data-listings-header-dropdown="market-data"] a');
              await sleep(180);
              const marketStayedOpen = await page.$eval(
                '[data-listings-header-dropdown="market-data"]',
                (menu) => menu.classList.contains('is-open'),
              );
              if (!marketStayedOpen) throw new Error('Market Data closed while the pointer entered the dropdown.');

              await page.hover('[data-hover-test="resources"]');
              await sleep(650);
              const switchedStates = await page.evaluate(() => ({
                marketOpen: document.querySelector('[data-listings-header-dropdown="market-data"]')?.classList.contains('is-open') || false,
                resourcesOpen: document.querySelector('[data-listings-header-dropdown="resources"]')?.classList.contains('is-open') || false,
              }));
              if (switchedStates.marketOpen || !switchedStates.resourcesOpen) {
                throw new Error(`Menu switching failed: ${JSON.stringify(switchedStates)}`);
              }

              await page.mouse.move(20, 600);
              await sleep(500);
              const resourcesClosed = await page.$eval(
                '[data-listings-header-dropdown="resources"]',
                (menu) => !menu.classList.contains('is-open') && menu.getAttribute('aria-hidden') === 'true',
              );
              if (!resourcesClosed) throw new Error('Resources did not close after the pointer left.');

              await page.click('[data-hover-test="market-data"]');
              await sleep(220);
              const clickOpened = await page.$eval(
                '[data-listings-header-dropdown="market-data"]',
                (menu) => menu.classList.contains('is-open'),
              );
              if (!clickOpened) throw new Error('Market Data did not remain usable by click.');

              await page.keyboard.press('Escape');
              await sleep(120);
              const escapedClosed = await page.$eval(
                '[data-listings-header-dropdown="market-data"]',
                (menu) => !menu.classList.contains('is-open'),
              );
              if (!escapedClosed) throw new Error('Escape did not close the open dropdown.');

              console.log('PASS: listings header dropdowns open on hover, remain open during entry, switch cleanly, close after exit, work by click, and close with Escape.');
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
