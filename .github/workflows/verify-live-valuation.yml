name: Verify live valuation page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for the production deployment
        run: sleep 60

      - name: Verify the hover and click behavior in Chrome
        run: |
          set -euo pipefail
          mkdir -p /tmp/fllm-live-check
          cd /tmp/fllm-live-check
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core >/dev/null

          cat > verify.cjs <<'JS'
          const { chromium } = require('playwright-core');
          const fs = require('fs');

          (async () => {
            const chromeCandidates = [
              '/usr/bin/google-chrome',
              '/usr/bin/google-chrome-stable',
              '/usr/bin/chromium-browser',
              '/usr/bin/chromium',
            ];
            const executablePath = chromeCandidates.find((candidate) => fs.existsSync(candidate));
            if (!executablePath) throw new Error('Chrome executable was not found on the runner.');

            const browser = await chromium.launch({
              headless: true,
              executablePath,
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const page = await browser.newPage({ viewport: { width: 1480, height: 1100 } });
            page.setDefaultTimeout(60000);

            const url = `https://www.floridaliquorlicensemarket.com/florida-liquor-license-value?ui_check=${process.env.GITHUB_SHA}#estimate`;
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.locator('select').first().waitFor({ state: 'visible' });

            const field = (text) => page.locator('label').filter({ hasText: text }).locator('select');
            await field('Florida County').selectOption({ label: 'Duval County' });
            await field('License Type').selectOption({ label: '4COP Quota' });
            await field('Current License Status').selectOption({ label: 'Not sure' });
            await field('Potential Sale Timing').selectOption({ label: 'Researching options' });
            await page.getByRole('button', { name: 'Calculate My Market Range' }).click();

            const row = page.locator('tbody tr').first();
            await row.waitFor({ state: 'visible' });
            const href = await row.locator('a').first().getAttribute('href');
            if (!href || !href.startsWith('/listings/')) {
              throw new Error(`Comparable row does not point to a listing page: ${href}`);
            }

            const before = await row.evaluate((element) => {
              const cell = element.querySelector('td');
              const cue = element.querySelector('a span:last-child');
              return {
                cursor: getComputedStyle(element).cursor,
                background: cell ? getComputedStyle(cell).backgroundColor : '',
                cueOpacity: cue ? getComputedStyle(cue).opacity : '',
              };
            });

            await row.hover();
            await page.waitForTimeout(300);

            const after = await row.evaluate((element) => {
              const cell = element.querySelector('td');
              const cue = element.querySelector('a span:last-child');
              return {
                cursor: getComputedStyle(element).cursor,
                background: cell ? getComputedStyle(cell).backgroundColor : '',
                cueOpacity: cue ? getComputedStyle(cue).opacity : '',
                cueText: cue ? cue.textContent.trim() : '',
              };
            });

            console.log('Comparable listing href:', href);
            console.log('Before hover:', JSON.stringify(before));
            console.log('After hover:', JSON.stringify(after));

            if (after.cursor !== 'pointer') throw new Error(`Expected pointer cursor; received ${after.cursor}`);
            if (after.background === before.background) throw new Error('Row background did not change on hover.');
            if (after.cueOpacity !== '1' || !after.cueText.includes('View listing')) {
              throw new Error(`View-listing cue is not visible after hover: ${JSON.stringify(after)}`);
            }

            await page.screenshot({ path: 'live-estimator-hover.png', fullPage: true });
            await row.click();
            await page.waitForURL('**/listings/**');
            console.log('Clicked row destination:', page.url());

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          JS

          GITHUB_SHA="$GITHUB_SHA" node verify.cjs
          cp live-estimator-hover.png "$GITHUB_WORKSPACE/live-estimator-hover.png"

      - name: Upload live-page verification screenshot
        uses: actions/upload-artifact@v4
        with:
          name: live-estimator-hover
          path: live-estimator-hover.png
          if-no-files-found: error
