name: Verify live valuation page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for the production deployment
        run: sleep 75

      - name: Inspect DNS, headers, and deployed client bundle
        env:
          APEX_URL: https://floridaliquorlicensemarket.com/florida-liquor-license-value
          WWW_URL: https://www.floridaliquorlicensemarket.com/florida-liquor-license-value
        run: |
          set -euo pipefail

          echo '=== DNS ==='
          echo 'Apex A records:'
          dig +short floridaliquorlicensemarket.com A || true
          echo 'Apex CNAME:'
          dig +short floridaliquorlicensemarket.com CNAME || true
          echo 'WWW A records:'
          dig +short www.floridaliquorlicensemarket.com A || true
          echo 'WWW CNAME:'
          dig +short www.floridaliquorlicensemarket.com CNAME || true

          check_url() {
            local label="$1"
            local url="$2"
            local workdir
            workdir="$(mktemp -d)"

            echo
            echo "=== ${label}: ${url} ==="
            echo '--- response headers ---'
            curl --retry 5 --retry-delay 5 --max-time 45 -sSIL "${url}?deployment_check=${GITHUB_SHA}" | sed -n '1,120p'

            curl --retry 5 --retry-delay 5 --max-time 45 -fsSL "${url}?deployment_check=${GITHUB_SHA}" -o "${workdir}/page.html"
            echo "HTML bytes: $(wc -c < "${workdir}/page.html")"
            echo "HTML title: $(grep -o '<title>[^<]*' "${workdir}/page.html" | head -1 | sed 's/<title>//' || true)"

            PAGE_URL="${url}" PAGE_FILE="${workdir}/page.html" BUNDLE_FILE="${workdir}/bundle.txt" python - <<'PY'
          import os
          import re
          import urllib.parse
          import urllib.request

          page_url = os.environ['PAGE_URL']
          page_file = os.environ['PAGE_FILE']
          bundle_file = os.environ['BUNDLE_FILE']

          html = open(page_file, 'r', encoding='utf-8', errors='ignore').read()
          sources = list(dict.fromkeys(re.findall(r'<script[^>]+src=["\']([^"\']+)', html)))
          print(f'Script sources found: {len(sources)}')

          with open(bundle_file, 'wb') as output:
              for source in sources:
                  absolute = urllib.parse.urljoin(page_url, source)
                  try:
                      request = urllib.request.Request(absolute, headers={'User-Agent': 'FLLM-Live-Verification/1.0'})
                      with urllib.request.urlopen(request, timeout=45) as response:
                          data = response.read()
                      output.write(data)
                      output.write(b'\n')
                      print(f'Fetched {len(data):>8} bytes  {absolute}')
                  except Exception as exc:
                      print(f'FAILED {absolute}: {exc}')
          PY

            echo "Client bundle bytes: $(wc -c < "${workdir}/bundle.txt")"
            echo '--- expected deployment markers ---'
            if grep -aFq 'View listing' "${workdir}/bundle.txt"; then
              echo 'FOUND: View listing'
            else
              echo 'MISSING: View listing'
            fi
            if grep -aFq 'View ${' "${workdir}/bundle.txt"; then
              echo 'FOUND: listing accessibility label code'
            fi
            if grep -aFq 'onMouseEnter' "${workdir}/bundle.txt"; then
              echo 'FOUND: hover prefetch code'
            fi
          }

          check_url 'APEX PRODUCTION' "$APEX_URL"
          check_url 'WWW PRODUCTION' "$WWW_URL"
