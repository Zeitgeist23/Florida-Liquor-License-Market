name: Verify live valuation page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for the production deployment
        run: sleep 75

      - name: Inspect DNS, headers, and deployed client bundle
        env:
          APEX_URL: https://floridaliquorlicensemarket.com/florida-liquor-license-value
          WWW_URL: https://www.floridaliquorlicensemarket.com/florida-liquor-license-value
        run: |
          set -euo pipefail

          echo '=== DNS ==='
          echo 'Apex A records:'
          dig +short floridaliquorlicensemarket.com A || true
          echo 'Apex CNAME:'
          dig +short floridaliquorlicensemarket.com CNAME || true
          echo 'WWW A records:'
          dig +short www.floridaliquorlicensemarket.com A || true
          echo 'WWW CNAME:'
          dig +short www.floridaliquorlicensemarket.com CNAME || true

          check_url() {
            local label="$1"
            local url="$2"
            local workdir
            workdir="$(mktemp -d)"

            echo
            echo "=== ${label}: ${url} ==="
            echo '--- response headers ---'
            curl --retry 5 --retry-delay 5 --max-time 45 -sSIL "${url}?deployment_check=${GITHUB_SHA}" | sed -n '1,120p'

            curl --retry 5 --retry-delay 5 --max-time 45 -fsSL "${url}?deployment_check=${GITHUB_SHA}" -o "${workdir}/page.html"
            echo "HTML bytes: $(wc -c < "${workdir}/page.html")"
            echo "HTML title: $(grep -o '<title>[^<]*' "${workdir}/page.html" | head -1 | sed 's/<title>//' || true)"

            PAGE_URL="${url}" PAGE_FILE="${workdir}/page.html" BUNDLE_FILE="${workdir}/bundle.txt" python - <<'PY'
          import os
          import re
          import urllib.parse
          import urllib.request

          page_url = os.environ['PAGE_URL']
          page_file = os.environ['PAGE_FILE']
          bundle_file = os.environ['BUNDLE_FILE']

          html = open(page_file, 'r', encoding='utf-8', errors='ignore').read()
          sources = list(dict.fromkeys(re.findall(r'<script[^>]+src=["\']([^"\']+)', html)))
          print(f'Script sources found: {len(sources)}')

          with open(bundle_file, 'wb') as output:
              for source in sources:
                  absolute = urllib.parse.urljoin(page_url, source)
                  try:
                      request = urllib.request.Request(absolute, headers={'User-Agent': 'FLLM-Live-Verification/1.0'})
                      with urllib.request.urlopen(request, timeout=45) as response:
                          data = response.read()
                      output.write(data)
                      output.write(b'\n')
                      print(f'Fetched {len(data):>8} bytes  {absolute}')
                  except Exception as exc:
                      print(f'FAILED {absolute}: {exc}')
          PY

            echo "Client bundle bytes: $(wc -c < "${workdir}/bundle.txt")"
            echo '--- expected deployment markers ---'
            grep -aFq 'View listing' "${workdir}/bundle.txt" && echo 'FOUND: View listing'
            grep -aFq 'onMouseEnter' "${workdir}/bundle.txt" && echo 'FOUND: hover prefetch code'
          }

          check_url 'APEX PRODUCTION' "$APEX_URL"
          check_url 'WWW PRODUCTION' "$WWW_URL"

      - name: Verify the hover and click behavior in Chrome
        run: |
          set -euo pipefail
          mkdir -p /tmp/fllm-live-check
          cd /tmp/fllm-live-check
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright-core >/dev/null

          cat > verify.cjs <<'JS'
          const { chromium } = require('playwright-core');
          const fs = require('fs');

          (async () => {
            const chromeCandidates = [
              '/usr/bin/google-chrome',
              '/usr/bin/google-chrome-stable',
              '/usr/bin/chromium-browser',
              '/usr/bin/chromium',
            ];
            const executablePath = chromeCandidates.find((candidate) => fs.existsSync(candidate));
            if (!executablePath) throw new Error('Chrome executable was not found on the runner.');

            const browser = await chromium.launch({
              headless: true,
              executablePath,
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const page = await browser.newPage({ viewport: { width: 1480, height: 1100 } });
            const url = `https://www.floridaliquorlicensemarket.com/florida-liquor-license-value?ui_check=${process.env.GITHUB_SHA}#estimate`;
            await page.goto(url, { waitUntil: 'networkidle', timeout: 90000 });

            const field = (text) => page.locator('label').filter({ hasText: text }).locator('select');
            await field('Florida County').selectOption({ label: 'Duval County' });
            await field('License Type').selectOption({ label: '4COP Quota' });
            await field('Current License Status').selectOption({ label: 'Not sure' });
            await field('Potential Sale Timing').selectOption({ label: 'Researching options' });
            await page.getByRole('button', { name: 'Calculate My Market Range' }).click();

            const row = page.locator('tbody tr').first();
            await row.waitFor({ state: 'visible', timeout: 60000 });
            const href = await row.locator('a').first().getAttribute('href');
            if (!href || !href.startsWith('/listings/')) {
              throw new Error(`Comparable row does not point to a listing page: ${href}`);
            }

            const before = await row.evaluate((element) => {
              const cell = element.querySelector('td');
              const cue = element.querySelector('a span:last-child');
              return {
                cursor: getComputedStyle(element).cursor,
                background: cell ? getComputedStyle(cell).backgroundColor : '',
                cueOpacity: cue ? getComputedStyle(cue).opacity : '',
              };
            });

            await row.hover();
            await page.waitForTimeout(250);

            const after = await row.evaluate((element) => {
              const cell = element.querySelector('td');
              const cue = element.querySelector('a span:last-child');
              return {
                cursor: getComputedStyle(element).cursor,
                background: cell ? getComputedStyle(cell).backgroundColor : '',
                cueOpacity: cue ? getComputedStyle(cue).opacity : '',
                cueText: cue ? cue.textContent.trim() : '',
              };
            });

            console.log('Comparable listing href:', href);
            console.log('Before hover:', JSON.stringify(before));
            console.log('After hover:', JSON.stringify(after));

            if (after.cursor !== 'pointer') throw new Error(`Expected pointer cursor; received ${after.cursor}`);
            if (after.background === before.background) throw new Error('Row background did not change on hover.');
            if (after.cueOpacity !== '1' || !after.cueText.includes('View listing')) {
              throw new Error(`View-listing cue is not visible after hover: ${JSON.stringify(after)}`);
            }

            await page.screenshot({ path: 'live-estimator-hover.png', fullPage: true });
            await row.click();
            await page.waitForURL('**/listings/**', { timeout: 60000 });
            console.log('Clicked row destination:', page.url());

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          JS

          GITHUB_SHA="$GITHUB_SHA" node verify.cjs
          cp live-estimator-hover.png "$GITHUB_WORKSPACE/live-estimator-hover.png"

      - name: Upload live-page verification screenshot
        uses: actions/upload-artifact@v4
        with:
          name: live-estimator-hover
          path: live-estimator-hover.png
          if-no-files-found: error
