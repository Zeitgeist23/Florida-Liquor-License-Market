name: Verify News Hub Build

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-news-build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js application
        run: npm run build

# Re-run after News & Insights JSX lint correction.
