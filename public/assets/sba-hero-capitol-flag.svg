<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061628"/>
      <stop offset="0.55" stop-color="#0a2744"/>
      <stop offset="1" stop-color="#06182a"/>
    </linearGradient>
    <radialGradient id="glow" cx="76%" cy="38%" r="48%">
      <stop offset="0" stop-color="#7ca4c6" stop-opacity=".18"/>
      <stop offset=".6" stop-color="#1d4163" stop-opacity=".08"/>
      <stop offset="1" stop-color="#06182a" stop-opacity="0"/>
