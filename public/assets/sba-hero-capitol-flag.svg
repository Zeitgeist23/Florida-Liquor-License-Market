      <stop offset="1" stop-color="#f6f7f7" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="flagFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-opacity="0"/>
      <stop offset=".35" stop-opacity=".35"/>
      <stop offset="1" stop-opacity=".82"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
